<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#16202e;--mute:#6b7585;--line:#e3e6ec;--acc:#d71920;--acc2:#e8a33d;--ok:#2e8b57;
--Bringa:#2f6fd6;--Futás:#d6542f;--Úszás:#1a9bb5;--Kondi:#7a52c7;--Brick:#c27a12;--Pihenő:#9aa3b0;--Utazás:#9aa3b0;--Egyéb:#6b7585;--Verseny:#e8a33d}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#18202c;--ink:#e8ecf2;--mute:#8d97a6;--line:#273142;--acc:#ff6b6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#d71920;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
header h1{margin:0;font-size:18px;font-weight:650}
header .sub{font-size:13px;opacity:.85}
#sync{position:absolute;right:14px;bottom:12px;font-size:12px;opacity:.85}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 84px);max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mute);font-size:12px;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.day h3{margin:0 0 6px;font-size:14px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.day.today{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.chk{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;color:#fff;font-size:16px;margin-top:1px}
.it.done .chk{background:var(--ok);border-color:var(--ok)}
.it.rest .chk{visibility:hidden}
.body{flex:1;min-width:0}
.t{font-weight:560}
.it.done .t{color:var(--mute);text-decoration:line-through}
.tag{display:inline-block;font-size:11px;font-weight:650;color:#fff;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.how{font-size:14px;color:var(--mute);margin-top:4px;display:none}
.it.open .how{display:block}
.extra{display:none;margin-top:8px}
.it.open .extra{display:block}
.extra textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
.feel{display:flex;gap:6px;margin:6px 0 2px;align-items:center;font-size:13px;color:var(--mute)}
.feel button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:15px;color:var(--ink)}
.feel button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.note{font-size:13px;color:var(--mute);margin-top:3px;font-style:italic}
.gm{font-size:13px;margin-top:4px;color:var(--ok)}
.wkhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 10px}
.wkhead button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:40px;height:36px;font-size:18px}
.wkhead .ttl{text-align:center;flex:1;font-weight:600;font-size:15px}
.wkhead .ttl small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.muted{color:var(--mute);font-size:14px}
.big{font-size:34px;font-weight:700;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:600}
input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--bg);color:var(--ink);margin:4px 0 10px}
.btn{display:inline-block;border:0;background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600}
.btn.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
.wkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.wkrow .bar{flex:0 0 40%;margin:0}
.wmegj{font-size:14px;color:var(--mute);margin:-4px 0 10px;padding:0 4px}

/* letisztult stílus */
:root{--bg:#fff;--line:#eee}
@media(prefers-color-scheme:dark){:root{--bg:#0f141c;--line:#232b38}}
header{background:var(--bg)!important;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:14px}
header h1{font-size:26px;font-weight:750;letter-spacing:-.02em}
header h1:after{content:"";display:block;width:28px;height:3px;background:#d71920;margin-top:6px;border-radius:2px}
header .sub{color:var(--mute);opacity:1;margin-top:6px}
header .sub b{color:#d71920}
#sync{color:#d71920}
.card{border:0;border-radius:0;padding:14px 4px;margin:0;border-bottom:1px solid var(--line);background:var(--bg)}
.day.today{box-shadow:none;border:0;border-left:3px solid #d71920;padding-left:12px;border-bottom:1px solid var(--line)}
.day h3{font-size:12px;letter-spacing:.08em;color:#d71920}
.it{border:0;padding:6px 0}
.tag{background:none!important;color:var(--c);padding:0;font-weight:650;font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.tag:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
td .tag{display:inline-flex}
.chk{width:24px;height:24px;flex-basis:24px;border-width:1.5px}
.it.done .chk{background:#d71920;border-color:#d71920}
nav{background:var(--bg);border-top:1px solid var(--line)}
.it.rest .tag{display:none}
.bar i{background:#d71920}
.bar{height:4px}
/* iPhone Naptár stílus */
:root{--bg:#fff;--line:#e5e5ea;--mute:#8e8e93;--ink:#000}
body{font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,sans-serif;letter-spacing:-.01em}
header{border-bottom:0!important;padding-bottom:6px!important}
header h1{font-size:30px!important;font-weight:700!important;letter-spacing:-.02em}
header h1:after{display:none!important}

main{padding:0 0 110px!important}

.day h3{font-size:17px!important;font-weight:600!important;letter-spacing:0!important;text-transform:none!important;color:#d71920!important;margin:0!important;padding:8px 16px 8px!important;border-bottom:1px solid var(--line)}
.day.today h3{font-weight:700!important}
.it{padding:11px 16px 11px 16px!important;border-bottom:1px solid var(--line)!important;margin-left:0;gap:12px!important;align-items:center!important}
.it:last-child{border-bottom:0!important}
.t{font-size:17px;font-weight:600}
.it.done .t{color:var(--mute)}
.tag{font-size:12px!important;letter-spacing:.04em!important;margin-bottom:1px!important}
.chk{width:24px!important;height:24px!important;flex-basis:24px!important;border:2px solid #c7c7cc!important}
.it.done .chk{border-color:#d71920!important}
.note{font-size:15px;font-style:normal;color:var(--mute)}
.wkhead{padding:6px 16px 0}#main>.bar{margin:6px 16px!important}#main>.muted{padding:0 16px}
.wkhead button{border-radius:20px!important;border:0!important;background:#f2f2f7!important}
nav{left:50%!important;right:auto!important;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 14px)!important;border:0!important;border-radius:30px;background:rgba(255,255,255,.82)!important;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 2px 20px rgba(0,0,0,.12);padding:0 8px!important;width:auto!important}
nav button{padding:9px 14px 8px!important;font-size:11px!important}
.chk{padding:0!important;display:grid!important;place-items:center!important;line-height:0}
.chk svg{display:block}
/* áthelyezés */
.it{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea{-webkit-user-select:text;user-select:text}
.it.dragging{opacity:.25}
.dragghost{position:fixed;z-index:50;background:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.22);border-radius:14px;pointer-events:none;transform:scale(1.03);border-bottom:0!important}
body.dragmode{overflow:hidden}
.day.drop h3{background:rgba(215,25,32,.10)}
.day.drop{box-shadow:inset 3px 0 0 #d71920}
.it.empty .t{color:var(--mute);font-weight:400;font-size:15px}
.it.empty{padding-top:8px!important;padding-bottom:8px!important}
.move{font-size:14px;color:var(--mute);margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.move select{font:inherit;font-size:15px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#f2f2f7;color:var(--ink)}
.move button{border:0;background:none;color:#d71920;font:inherit;font-size:14px;padding:4px 0}
.hint{font-size:13px;margin:-2px 0 10px}
/* új funkciók */
.gmx{font-size:14px;color:var(--mute);padding:8px 16px;border-top:1px solid var(--line)}
.addwrap{padding:4px 16px 20px}
.addform{padding:0 16px 16px!important}
.addform h3{font-size:17px;font-weight:600;color:#d71920;margin:0 0 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.addform label{display:block;font-size:13px;color:var(--mute);margin:8px 0}
.addform select,.addform input[type=text],.addform input[type=number]{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#f2f2f7;color:var(--ink)}
.addform .row{display:flex;gap:10px;align-items:center;margin-top:10px;color:var(--ink);font-size:15px}
.del{border:0;background:none;color:#d71920;font:inherit;font-size:14px;padding:8px 0}
.knee button{font-size:13px!important}
.legend{font-size:12px;margin:4px 0 8px}
.lg{display:inline-block;width:12px;height:8px;border-radius:2px;margin:0 4px 0 8px;vertical-align:0}
.lg.p{background:var(--line)}.lg.d{background:#d71920}
.wn{flex:0 0 52px;font-size:13px}
.hb{flex:1;position:relative;height:10px;background:none}
.hb i{position:absolute;left:0;top:0;height:10px;border-radius:5px}
.hb i.p{background:var(--line)}.hb i.d{background:#d71920;height:6px;top:2px}
.hv{flex:0 0 74px;text-align:right;font-size:12px!important;padding:0!important}
.notes{margin-top:8px}
.nrow{font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.kn{font-size:12px;border-radius:6px;padding:1px 6px;margin-left:4px}
.kn.k1{background:#fbeccf;color:#8a5a00}.kn.k2{background:#fbd5d6;color:#a3141a}
#main input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#f2f2f7;color:var(--ink);margin:4px 0 10px}
.card:not(.day){padding:12px 16px!important;border-bottom:1px solid var(--line)!important}
.card:not(.day) b{font-size:17px}
.feel{flex-wrap:wrap}
.wkrow{padding:7px 0}
#main label.muted{display:block;margin-top:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:#f2f2f7;color:var(--ink);border-radius:14px;padding:6px 12px;font:inherit;font-size:16px;font-weight:600;display:flex;flex-direction:column;align-items:center;min-width:54px}
.chip small{font-size:11px;font-weight:500;color:var(--mute)}
.chip.on{background:#d71920;color:#fff}.chip.on small{color:#ffd6d6}

.pz{font-size:15px;color:var(--mute);padding:8px 0}
.pm{font-size:13px;color:var(--mute);margin-top:6px}
.pl{display:inline-block;font-size:14px;color:#d71920;margin-top:6px;text-decoration:none}
nav button{padding:9px 10px 8px!important}

.seg{display:flex;margin:8px 16px 4px;background:#f2f2f7;border-radius:10px;padding:2px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;font-weight:600;padding:7px 0;border-radius:8px;color:var(--ink)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);color:#d71920}
.grid{display:grid;gap:1.5px;align-items:center;margin-top:4px}
.gl{font-size:11px;color:var(--mute)}
.gc{height:20px;border-radius:2px;background:#e5e5ea}

.lb i.h{background:#a8dbe6}

.mk{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}

.lb{display:flex;gap:2px}.lb i{width:5px;height:18px;border-radius:2px;background:#e5e5ea}.lb i.f{background:var(--Úszás)}
nav button span.ic{height:20px;display:flex;align-items:center}
nav button{font-size:0!important;padding:12px 16px!important;gap:0!important}
nav button span{font-size:22px}
nav button span.ic svg{width:24px;height:22px}
